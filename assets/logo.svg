<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="taxtsueri">
  <!-- taxtsueri — eCH-0119 Steuererklärung Zürich.
       Zürcher Wappenfarben (blau/weiss, diagonal geteilt) als Kachel,
       darauf ein Dokument mit Barcode-Streifen (eCH-0196/eCH-0119). -->
  <defs>
    <clipPath id="tile">
      <rect x="16" y="16" width="480" height="480" rx="104" ry="104"/>
    </clipPath>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a63c4"/>
      <stop offset="1" stop-color="#0846a0"/>
    </linearGradient>
  </defs>

  <!-- Zürcher Schild: weiss oben-rechts, blau unten-links, diagonale Teilung -->
  <g clip-path="url(#tile)">
    <rect x="16" y="16" width="480" height="480" fill="#ffffff"/>
    <polygon points="16,496 16,16 496,496" fill="url(#blue)"/>
  </g>
  <rect x="16" y="16" width="480" height="480" rx="104" ry="104" fill="none"
        stroke="#062f6e" stroke-opacity="0.18" stroke-width="4"/>

  <!-- Dokumentenblatt, leicht gedreht, mit Eselsohr -->
  <g transform="rotate(-6 256 256)">
    <!-- weicher Schlagschatten (manuell, da feDropShadow nicht überall geht) -->
    <path d="M150 132 h150 l62 62 v186 a14 14 0 0 1 -14 14 H150 a14 14 0 0 1 -14 -14 V146 a14 14 0 0 1 14 -14 Z"
          fill="#062f6e" fill-opacity="0.20" transform="translate(0 9)"/>
    <path d="M150 132 h150 l62 62 v186 a14 14 0 0 1 -14 14 H150 a14 14 0 0 1 -14 -14 V146 a14 14 0 0 1 14 -14 Z"
          fill="#ffffff" stroke="#062f6e" stroke-width="6" stroke-linejoin="round"/>
    <path d="M300 132 v48 a14 14 0 0 0 14 14 h48" fill="none" stroke="#062f6e" stroke-width="6" stroke-linejoin="round"/>

    <!-- Textzeilen -->
    <g stroke="#0a63c4" stroke-width="11" stroke-linecap="round">
      <line x1="172" y1="206" x2="296" y2="206"/>
      <line x1="172" y1="238" x2="328" y2="238"/>
      <line x1="172" y1="270" x2="312" y2="270"/>
    </g>

    <!-- Barcode-Streifen (Signatur der App) -->
    <g fill="#062f6e">
      <rect x="172" y="306" width="6"  height="58"/>
      <rect x="184" y="306" width="12" height="58"/>
      <rect x="202" y="306" width="5"  height="58"/>
      <rect x="213" y="306" width="9"  height="58"/>
      <rect x="228" y="306" width="5"  height="58"/>
      <rect x="239" y="306" width="14" height="58"/>
      <rect x="259" y="306" width="5"  height="58"/>
      <rect x="270" y="306" width="8"  height="58"/>
      <rect x="284" y="306" width="12" height="58"/>
      <rect x="302" y="306" width="5"  height="58"/>
      <rect x="313" y="306" width="9"  height="58"/>
      <rect x="328" y="306" width="6"  height="58"/>
    </g>

    <!-- Häkchen: validiert -->
    <circle cx="330" cy="332" r="40" fill="#1aa758" stroke="#ffffff" stroke-width="6"/>
    <path d="M312 332 l13 14 24 -28" fill="none" stroke="#ffffff" stroke-width="9"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
