[package]
name = "taxtsueri"
version = "0.1.0"
edition = "2021"
description = "eCH-0119 Steuererklärung-XML-Generator für den Kanton/die Stadt Zürich"
license = "GPL-3.0-or-later"
repository = "https://github.com/zdavatz/taxtsueri"

[dependencies]
flate2 = "1.1.9"
lopdf = "0.41.0"
quick-xml = { version = "0.37", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "taxtsueri"
path = "src/main.rs"
