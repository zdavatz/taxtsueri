[package]
name = "taxtsueri"
version = "0.1.0"
edition = "2021"
description = "eCH-0119 Steuererklärung-XML-Generator für den Kanton/die Stadt Zürich"
license = "GPL-3.0-or-later"
repository = "https://github.com/zdavatz/taxtsueri"

[lib]
name = "taxtsueri"
path = "src/lib.rs"

[[bin]]
name = "taxtsueri"
path = "src/main.rs"

# Desktop-GUI (eframe). Nur mit `--features gui` gebaut, damit die CLI
# schlank bleibt (kein eframe/reqwest im Standardbuild).
[[bin]]
name = "taxtsueri-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[features]
gui = ["dep:eframe", "dep:egui", "dep:rfd", "dep:reqwest"]

[dependencies]
barcoders = "2.0.0"
flate2 = "1.1.9"
lopdf = "0.41.0"
quick-xml = { version = "0.37", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# GUI-only (optional, via Feature `gui`):
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"], optional = true }
egui = { version = "0.29", optional = true }
rfd = { version = "0.15", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }

[dev-dependencies]
rxing = "0.9.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
