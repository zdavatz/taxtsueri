name: release

# Baut das Desktop-GUI (taxtsueri-gui) für Linux/Windows/macOS bei einem
# Tag `vX.Y.Z` und hängt die Artefakte an das GitHub-Release. Die Asset-Namen
# enden auf die Suffixe, die der In-App-Updater (src/update.rs) erwartet.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip
          - os: macos-14
            target: aarch64-apple-darwin
            ext: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux-Build-Abhängigkeiten (eframe/glow/xkb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build GUI (release)
        run: cargo build --release --features gui --bin taxtsueri-gui --target ${{ matrix.target }}

      - name: Paketieren (Linux)
        if: runner.os == 'Linux'
        run: |
          BIN=target/${{ matrix.target }}/release/taxtsueri-gui
          tar -czf taxtsueri-gui-${{ matrix.target }}.${{ matrix.ext }} -C "$(dirname "$BIN")" taxtsueri-gui

      - name: Paketieren (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/taxtsueri-gui.exe `
            -DestinationPath taxtsueri-gui-${{ matrix.target }}.${{ matrix.ext }}

      - name: Paketieren (macOS, unsigniertes DMG)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmgroot
          cp target/${{ matrix.target }}/release/taxtsueri-gui dmgroot/
          hdiutil create -volname taxtsueri -srcfolder dmgroot -ov -format UDZO \
            taxtsueri-gui-macos-aarch64.${{ matrix.ext }}

      - name: Asset ans Release hängen
        uses: softprops/action-gh-release@v2
        with:
          files: taxtsueri-gui-*.${{ matrix.ext }}
